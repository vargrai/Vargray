<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@500;700;800&display=swap">
<style>
  :root {
    --bg: #0B0F17;
    --bg2: #06090F;
    --ink: #EAF1F8;
    --ink-soft: #8B98A9;
    --accent: #2E7CF6;
    --accent2: #19C3E6;
    --green: #35D07F;
    --gold: #F2C14E;
    --panel: #141A24;
    --line: #26304A;
    --shadow: #05070C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(var(--bg), var(--bg2)) fixed;
    color: var(--ink);
    font-family: 'Nunito', system-ui, sans-serif;
    min-height: 100dvh;
    touch-action: manipulation;
  }
  .app { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }

  /* ---------- сайдбар (десктоп) ---------- */
  .sidebar {
    display: none;
    flex-direction: column; gap: 14px;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 18px;
    box-shadow: 5px 5px 0 var(--shadow);
    padding: 18px 16px;
  }
  .side-logo { font-family: 'Unbounded'; font-weight: 900; font-size: 1.45rem; }
  .side-logo span { color: var(--accent); }
  .side-profile {
    background: var(--bg);
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
  }
  .side-profile .row { display: flex; align-items: center; gap: 10px; }
  .side-profile .tokens { margin-top: 8px; text-align: right; }
  .nav-btn {
    display: block; width: 100%; text-align: left;
    font-family: 'Unbounded'; font-weight: 700; font-size: 0.85rem;
    background: var(--bg); color: var(--ink);
    border: 3px solid var(--line); border-radius: 12px;
    padding: 11px 14px; cursor: pointer;
  }
  .nav-btn:hover { background: var(--line); }
  .nav-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #FFFFFF; border-color: transparent; }
  .side-mascot { font-size: 2rem; text-align: center; margin-top: auto; }

  /* ---------- переключатель языка ---------- */
  .lang { display: flex; gap: 6px; }
  .lang button {
    flex: 1;
    font-family: 'Unbounded'; font-weight: 700; font-size: 0.68rem;
    padding: 7px 0;
    background: var(--bg); color: var(--ink);
    border: 2px solid var(--line); border-radius: 8px;
    cursor: pointer;
  }
  .lang button.active { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
  .lang button:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .lang-mobile { max-width: 200px; margin: 0 0 12px auto; }

  /* ---------- шапка (мобилка) ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 10px 14px;
    margin-bottom: 16px;
    cursor: pointer;
  }
  .ava {
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center;
    font-size: 30px;
    background: var(--bg);
    border: 3px solid var(--line);
    border-radius: 14px;
  }
  .ava.frame-gold { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold) inset; }
  .ava.frame-neon { border-color: #19C3E6; box-shadow: 0 0 8px #19C3E6; }
  .ava.frame-fire { border-color: transparent; background:
    linear-gradient(var(--bg), var(--bg)) padding-box,
    linear-gradient(135deg, #FF5722, #FFC107) border-box; }
  .top-info { flex: 1; min-width: 0; }
  .top-name { font-weight: 800; font-size: 1.02rem; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .top-name .lvl { color: var(--accent); font-family: 'Unbounded'; font-size: 0.78rem; white-space: nowrap; }
  .xpbar {
    height: 10px; border: 2px solid var(--line); border-radius: 99px;
    background: var(--bg); overflow: hidden; margin-top: 5px;
  }
  .xpbar i {
    display: block; height: 100%;
    background: linear-gradient(90deg, var(--green), #7ED957);
    transition: width 0.4s;
  }
  .tokens {
    font-family: 'Unbounded'; font-weight: 700; font-size: 0.95rem;
    color: var(--gold); white-space: nowrap;
  }

  /* ---------- экраны ---------- */
  .screen { display: none; }
  .screen.active { display: block; }
  h1 {
    font-family: 'Unbounded'; font-weight: 900;
    font-size: 1.5rem; text-align: center; margin-bottom: 2px;
  }
  h1 .v { color: var(--accent); }
  .sub { text-align: center; color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 16px; }
  h2 { font-family: 'Unbounded'; font-size: 1.05rem; margin: 18px 0 10px; }

  /* ---------- сетка игр ---------- */
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .gcard {
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow: 4px 4px 0 var(--shadow);
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.08s;
  }
  .gcard:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
  .gcard .cover {
    height: 72px;
    display: grid; place-items: center;
    font-size: 2.4rem;
    border-bottom: 3px solid var(--line);
  }
  .gcard .gbody { padding: 9px 12px 11px; }
  .gcard .nm { font-family: 'Unbounded'; font-weight: 700; font-size: 0.82rem; }
  .gcard .ds { color: var(--ink-soft); font-size: 0.76rem; margin-top: 3px; }
  .gcard .bs { margin-top: 7px; font-size: 0.74rem; font-weight: 800; color: var(--green); }
  .gcard.soon { opacity: 0.55; cursor: default; }
  .gcard.soon:active { transform: none; box-shadow: 4px 4px 0 var(--shadow); }
  .gcard.soon .cover { background: var(--bg); }

  /* ---------- маскот ---------- */
  .mascot { display: flex; gap: 10px; align-items: flex-end; margin-top: 20px; }
  .mascot .face { font-size: 2.6rem; animation: bounce 2.4s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .mascot .face { animation: none; } }
  .bubble {
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 14px 14px 14px 4px;
    padding: 10px 14px;
    font-size: 0.88rem;
    box-shadow: 3px 3px 0 var(--shadow);
  }
  .bubble b { color: var(--accent); }

  /* ---------- кнопки ---------- */
  .btn {
    font-family: 'Unbounded'; font-weight: 700; font-size: 0.95rem;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #FFFFFF;
    border: 3px solid var(--line); border-radius: 14px;
    padding: 12px 24px; cursor: pointer;
    box-shadow: 4px 4px 0 var(--shadow);
  }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--shadow); }
  .btn.sm { font-size: 0.78rem; padding: 8px 16px; box-shadow: 3px 3px 0 var(--shadow); }
  .btn.ghost { background: var(--panel); color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .backrow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 10px; }

  /* ---------- игровая сцена ---------- */
  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    max-height: 60dvh;
    background: var(--panel);
    border: 3px solid var(--line);
    border-radius: 16px;
    box-shadow: 4px 4px 0 var(--shadow);
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .hud { display: flex; gap: 16px; justify-content: center; font-weight: 800; margin: 10px 0; }
  .overlay {
    position: absolute; inset: 0;
    background: color-mix(in srgb, var(--panel) 90%, transparent);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; gap: 8px;
  }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: 2.6rem; }
  .overlay h3 { font-family: 'Unbounded'; font-size: 1.1rem; }
  .overlay p { color: var(--ink-soft); font-size: 0.9rem; max-width: 34ch; }
  .reward { display: flex; gap: 14px; margin: 6px 0; font-family: 'Unbounded'; font-weight: 700; font-size: 0.9rem; }
  .reward .xp { color: var(--green); }
  .reward .tk { color: var(--gold); }

  /* ---------- профиль и магазин ---------- */
  .card {
    background: var(--panel); border: 3px solid var(--line);
    border-radius: 16px; box-shadow: 4px 4px 0 var(--shadow);
    padding: 16px;
  }
  .profile-head { display: flex; gap: 14px; align-items: center; }
  .profile-head .ava { width: 68px; height: 68px; font-size: 40px; }
  .nick-row { display: flex; gap: 8px; margin-top: 10px; }
  .nick-row input {
    flex: 1; min-width: 0;
    font-family: 'Nunito'; font-weight: 700; font-size: 0.95rem;
    padding: 9px 12px;
    background: var(--bg); color: var(--ink);
    border: 3px solid var(--line); border-radius: 12px;
  }
  .nick-row input:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
  .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .shop-item {
    background: var(--bg);
    border: 3px solid var(--line); border-radius: 14px;
    padding: 10px 4px 8px;
    text-align: center; cursor: pointer;
  }
  .shop-item .em { font-size: 1.7rem; }
  .shop-item .pr { font-size: 0.72rem; font-weight: 800; color: var(--gold); margin-top: 4px; }
  .shop-item.owned .pr { color: var(--green); }
  .shop-item.equipped { border-color: var(--green); box-shadow: 0 0 0 2px var(--green) inset; }
  .stat-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 2px dashed var(--line); font-size: 0.9rem; gap: 10px; }
  .stat-row:last-child { border-bottom: none; }
  .stat-row b { font-family: 'Unbounded'; font-size: 0.82rem; white-space: nowrap; }

  /* ---------- ежедневный бонус ---------- */
  .daily {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--panel);
    border: 3px solid var(--gold);
    border-radius: 14px;
    box-shadow: 4px 4px 0 var(--shadow);
    padding: 10px 14px;
    margin-bottom: 14px;
    font-weight: 800; font-size: 0.88rem;
    flex-wrap: wrap;
  }

  /* ---------- достижения ---------- */
  .ach-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 2px dashed var(--line); }
  .ach-row:last-child { border-bottom: none; }
  .ach-row .em { font-size: 1.5rem; width: 34px; text-align: center; flex: none; }
  .ach-row .tx { flex: 1; min-width: 0; }
  .ach-row .tx b { font-size: 0.9rem; }
  .ach-row .tx small { display: block; color: var(--ink-soft); font-size: 0.78rem; }
  .ach-row .rw { font-family: 'Unbounded'; font-weight: 700; font-size: 0.78rem; color: var(--gold); white-space: nowrap; }
  .ach-row.done .rw { color: var(--green); }
  .ach-row.locked { opacity: 0.55; }
  .ach-row.locked .em { filter: grayscale(1); }

  /* ---------- логотип-маскот ---------- */
  .brand-img {
    width: 100%; display: block;
    mix-blend-mode: screen;
  }
  .home-logo {
    width: 130px; height: 130px; display: block;
    margin: 0 auto 4px;
    mix-blend-mode: screen;
  }
  .mascot .face { line-height: 0; }
  .mascot .face img {
    width: 76px; height: 76px; display: block;
    mix-blend-mode: screen;
  }

  /* ---------- тост ---------- */
  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 9px 20px; border-radius: 999px; font-size: 0.85rem; font-weight: 700;
    opacity: 0; transition: opacity 0.25s; pointer-events: none;
    white-space: nowrap; z-index: 50;
  }
  #toast.show { opacity: 1; }

  /* ================= ДЕСКТОП: ЛАУНЧЕР ================= */
  @media (min-width: 900px) {
    .app {
      max-width: 1180px;
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 26px;
      align-items: start;
      padding: 24px 24px 48px;
    }
    .sidebar { display: flex; position: sticky; top: 24px; min-height: calc(100dvh - 48px); }
    .topbar { display: none; }
    .lang-mobile { display: none; }
    h1, .sub { text-align: left; }
    .home-logo { margin: 0 0 6px; }
    h1 { font-size: 1.9rem; }
    .games { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .gcard .cover { height: 128px; font-size: 3.6rem; }
    .gcard .nm { font-size: 0.95rem; }
    .gcard .ds { font-size: 0.82rem; }
    .stage { max-width: 470px; }
    .mascot { max-width: 520px; }
    .daily { max-width: 640px; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== САЙДБАР (десктоп) ===== -->
  <aside class="sidebar">
    <img class="brand-img" id="brandSide" alt="VarGray">
    <div class="side-profile" id="sideProfile">
      <div class="row">
        <div class="ava" id="sAva">🙂</div>
        <div style="flex:1;min-width:0">
          <div class="top-name"><span id="sName">Гравець</span></div>
          <div class="top-name"><span class="lvl"><span id="lvlWordS"></span> <span id="sLvl">1</span></span></div>
        </div>
      </div>
      <div class="xpbar" style="margin-top:8px"><i id="sXp" style="width:0%"></i></div>
      <div class="tokens">🪙 <span id="sTokens">0</span></div>
    </div>
    <button class="nav-btn" data-nav="home" id="navHome">🏠</button>
    <button class="nav-btn" data-nav="profile" id="navProfile">👤</button>
    <div class="lang">
      <button data-lang="uk" type="button">UA</button>
      <button data-lang="en" type="button">EN</button>
      <button data-lang="ru" type="button">RU</button>
    </div>
  </aside>

  <!-- ===== КОНТЕНТ ===== -->
  <main class="content">

    <!-- шапка (мобилка) -->
    <div class="topbar" id="topbar">
      <div class="ava" id="topAva">🙂</div>
      <div class="top-info">
        <div class="top-name"><span id="topName">Гравець</span> <span class="lvl"><span id="lvlWordT"></span> <span id="topLvl">1</span></span></div>
        <div class="xpbar"><i id="topXp" style="width:0%"></i></div>
      </div>
      <div class="tokens">🪙 <span id="topTokens">0</span></div>
    </div>

    <!-- ГЛАВНАЯ -->
    <section class="screen active" id="scr-home">
      <img class="home-logo" id="brandHome" alt="VarGray">
      <h1 id="brandTitle">Вар<span class="v">Грай</span></h1>
      <p class="sub" id="subTag"></p>

      <div class="daily" id="dailyBox"></div>
      <div class="games" id="gamesGrid"></div>

      <div class="mascot">
        <div class="face"><img id="brandMascot" alt=""></div>
        <div class="bubble" id="mascotSay"></div>
      </div>
    </section>

    <!-- ПРОФИЛЬ -->
    <section class="screen" id="scr-profile">
      <div class="backrow">
        <button class="btn sm ghost" data-nav="home" id="profBack">←</button>
        <span class="tokens">🪙 <span id="profTokens">0</span></span>
      </div>

      <div class="lang lang-mobile">
        <button data-lang="uk" type="button">UA</button>
        <button data-lang="en" type="button">EN</button>
        <button data-lang="ru" type="button">RU</button>
      </div>

      <div class="card">
        <div class="profile-head">
          <div class="ava" id="profAva">🙂</div>
          <div style="flex:1">
            <div class="top-name"><span id="profName">Гравець</span> <span class="lvl"><span id="lvlWordP"></span> <span id="profLvl">1</span></span></div>
            <div class="xpbar" style="margin-top:8px"><i id="profXp" style="width:0%"></i></div>
            <div style="font-size:0.78rem;color:var(--ink-soft);margin-top:4px"><span id="profXpText"></span></div>
          </div>
        </div>
        <div class="nick-row">
          <input id="nickInput" maxlength="16">
          <button class="btn sm" id="nickSave">Ok</button>
        </div>
      </div>

      <h2 id="hAva"></h2>
      <div class="shop-grid" id="avaShop"></div>

      <h2 id="hFr"></h2>
      <div class="shop-grid" id="frameShop"></div>

      <h2><span id="hAch"></span> <span style="color:var(--ink-soft);font-size:0.8rem" id="achCount"></span></h2>
      <div class="card" id="achBox"></div>

      <h2 id="hSt"></h2>
      <div class="card" id="statsBox"></div>
    </section>

    <!-- ИГРА -->
    <section class="screen" id="scr-game">
      <div class="backrow">
        <button class="btn sm ghost" data-nav="home" id="gameBack">←</button>
        <div class="hud" style="margin:0" id="gameHud"></div>
      </div>
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="overlay" id="gameOverlay">
          <div class="big" id="ovEmoji">🎮</div>
          <h3 id="ovTitle"></h3>
          <p id="ovText"></p>
          <div class="reward" id="ovReward" style="display:none">
            <span class="xp">+<span id="ovXp">0</span> XP</span>
            <span class="tk">+<span id="ovTk">0</span> 🪙</span>
          </div>
          <button class="btn" id="ovBtn"></button>
        </div>
      </div>
      <p class="sub" id="gameHint" style="margin-top:10px;text-align:center"></p>
    </section>

  </main>
</div>
<div id="toast"></div>

<script>

  let LANG = detectLang();
  function detectLang() {
    try {
      const saved = localStorage.getItem('vargrai_lang');
      if (saved && T[saved]) return saved;
    } catch (e) {}
    const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'uk'];
    for (const l of langs) {
      const p = String(l).toLowerCase().slice(0, 2);
      if (T[p]) return p;
    }
    return 'en';
  }
  function t(key) { return (T[LANG] && T[LANG][key] !== undefined) ? T[LANG][key] : T.uk[key]; }
  function fmt(str, vars) {
    return String(str).replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined) ? vars[k] : m);
  }
  function setLang(l) {
    if (!T[l]) return;
    LANG = l;
    try { localStorage.setItem('vargrai_lang', l); } catch (e) {}
    document.documentElement.lang = l === 'uk' ? 'uk' : l;
    applyLang();
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]');
    if (b) setLang(b.dataset.lang);
  });

  /* ================= ПРОФИЛЬ И ПРОГРЕСС ================= */

  const DEFAULT_PROFILE = {
    name: '',
    avatar: '🙂',
    frame: 'none',
    xp: 0,
    level: 1,
    tokens: 0,
    owned: ['🙂', '😎', '🥟'],
    ownedFrames: ['none'],
    best: { varenyk: 0, snake: 0, react: 0, miner: 0 },
    tot: { varenyk: 0, snake: 0, minerWins: 0 },
    daily: { last: '', streak: 0 },
    ach: [],
    plays: 0
  };

  let P = loadProfile();

  function loadProfile() {
    try {
      const raw = localStorage.getItem('vargrai_profile');
      if (raw) {
        const p = JSON.parse(raw);
        return Object.assign({}, DEFAULT_PROFILE, p, {
          best: Object.assign({}, DEFAULT_PROFILE.best, p.best || {}),
          tot: Object.assign({}, DEFAULT_PROFILE.tot, p.tot || {}),
          daily: Object.assign({}, DEFAULT_PROFILE.daily, p.daily || {}),
          ach: Array.isArray(p.ach) ? p.ach : []
        });
      }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULT_PROFILE));
  }
  function save() {
    try { localStorage.setItem('vargrai_profile', JSON.stringify(P)); } catch (e) {}
  }
  function playerName() { return P.name || (LANG === 'en' ? 'Player' : (LANG === 'ru' ? 'Игрок' : 'Гравець')); }

  function xpNeed(level) { return 80 + (level - 1) * 45; }

  function addXp(amount) {
    P.xp += amount;
    let leveled = 0;
    while (P.xp >= xpNeed(P.level)) {
      P.xp -= xpNeed(P.level);
      P.level++;
      leveled++;
      P.tokens += 25;
    }
    if (leveled > 0) {
      toast(fmt(t('lvlup'), { n: P.level, tk: 25 * leveled }));
      mascot(fmt(t('mascot_lvl'), { n: P.level }));
    }
    save(); renderTop();
  }
  function addTokens(n) { P.tokens += n; save(); renderTop(); }

  /* ================= НАВИГАЦИЯ ================= */

  const screens = {
    home: document.getElementById('scr-home'),
    profile: document.getElementById('scr-profile'),
    game: document.getElementById('scr-game')
  };
  function show(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    document.getElementById('navHome').classList.toggle('active', name === 'home');
    document.getElementById('navProfile').classList.toggle('active', name === 'profile');
    if (name === 'home') { stopCurrentGame(); renderHome(); }
    if (name === 'profile') { stopCurrentGame(); renderProfile(); }
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-nav]');
    if (b) show(b.dataset.nav);
  });
  document.getElementById('topbar').addEventListener('click', () => show('profile'));
  document.getElementById('sideProfile').addEventListener('click', () => show('profile'));

  function frameClass(f) { return f === 'none' ? '' : 'frame-' + f; }

  function renderTop() {
    const pct = Math.round(P.xp / xpNeed(P.level) * 100) + '%';
    // мобильная шапка
    document.getElementById('topName').textContent = playerName();
    document.getElementById('topLvl').textContent = P.level;
    document.getElementById('topTokens').textContent = P.tokens;
    document.getElementById('topXp').style.width = pct;
    const ta = document.getElementById('topAva');
    ta.textContent = P.avatar; ta.className = 'ava ' + frameClass(P.frame);
    // сайдбар
    document.getElementById('sName').textContent = playerName();
    document.getElementById('sLvl').textContent = P.level;
    document.getElementById('sTokens').textContent = P.tokens;
    document.getElementById('sXp').style.width = pct;

    sa.textContent = P.avatar; sa.className = 'ava ' + frameClass(P.frame);

  function renderHome() {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = '';
    GAMES.forEach(g => {
      const el = document.createElement('div');

      el.innerHTML =

        '<div class="gbody"><div class="nm">' + t('g_' + g.id) + '</div>' +

        '<div class="bs">' + t('rec') + ': ' + (best === null ? '—' : best) + '</div></div>';
      el.addEventListener('click', () => startGame(g.id));
      grid.appendChild(el);
    });
    const soon = document.createElement('div');

  /* ---- маскот ---- */
  function mascot(html) {
    document.getElementById('mascotSay').innerHTML = '<b>' + t('mname') + ':</b> ' + html;
  }

  /* ---- ежедневный бонус ---- */
  function dateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function todayStr() { return dateStr(new Date()); }
  function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return dateStr(d); }
  function dailyReward(streak) { return Math.min(10 + streak * 10, 80); }

  function renderDaily() {
    const box = document.getElementById('dailyBox');
    if (P.daily.last === todayStr()) {
      box.innerHTML = '<span>' + fmt(t('daily_done'), { n: P.daily.streak }) + '</span><span>' + t('daily_come') + '</span>';
    } else {
      const nextStreak = (P.daily.last === yesterdayStr()) ? P.daily.streak + 1 : 1;
      box.innerHTML = '<span>' + fmt(t('daily_new'), { n: nextStreak }) + '</span>' +
        '<button class="btn sm" id="dailyClaim" type="button">' + fmt(t('daily_take'), { n: dailyReward(nextStreak) }) + '</button>';
    }
  }
  document.getElementById('dailyBox').addEventListener('click', e => {
    if (e.target.id !== 'dailyClaim') return;
    const today = todayStr();
    if (P.daily.last === today) return;
    P.daily.streak = (P.daily.last === yesterdayStr()) ? P.daily.streak + 1 : 1;
    P.daily.last = today;
    const tk = dailyReward(P.daily.streak);
    P.tokens += tk;
    save();
    addXp(10);
    renderDaily();
    toast(fmt(t('daily_toast'), { tk: tk, n: P.daily.streak }));
    mascot(fmt(t('mascot_daily'), { n: P.daily.streak }));
    checkAch();
  });

  /* ---- достижения ---- */
  const ACHS = [
    { id: 'first', em: '🎮', tk: 10, cond: p => p.plays >= 1 },
    { id: 'p25', em: '🔥', tk: 30, cond: p => p.plays >= 25 },
    { id: 'p100', em: '🏟️', tk: 100, cond: p => p.plays >= 100 },
    { id: 'var100', em: '🥟', tk: 40, cond: p => p.tot.varenyk >= 100 },
    { id: 'var30', em: '👨‍🍳', tk: 50, cond: p => p.best.varenyk >= 30 },
    { id: 'snake15', em: '🐍', tk: 50, cond: p => p.best.snake >= 15 },
    { id: 'react250', em: '⚡', tk: 50, cond: p => p.best.react > 0 && p.best.react < 250 },
    { id: 'miner1', em: '💣', tk: 40, cond: p => p.tot.minerWins >= 1 },
    { id: 'miner60', em: '🕐', tk: 80, cond: p => p.best.miner > 0 && p.best.miner < 60 },
    { id: 'lvl5', em: '⭐', tk: 50, cond: p => p.level >= 5 },

  ];
  function checkAch() {
    const got = [];
    ACHS.forEach(a => {
      if (!P.ach.includes(a.id) && a.cond(P)) {
        P.ach.push(a.id);
        P.tokens += a.tk;
        got.push(a);
      }
    });
    if (got.length) {
      save(); renderTop();
      got.forEach((a, i) => setTimeout(() =>
        toast(fmt(t('ach_toast'), { x: t('ach')[a.id][0], tk: a.tk })), i * 2400));
    }
  }

  /* ================= ИГРОВОЙ ДВИЖОК ================= */

  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('gameOverlay');
  const ovEmoji = document.getElementById('ovEmoji');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const ovReward = document.getElementById('ovReward');
  const ovBtn = document.getElementById('ovBtn');
  const gameHud = document.getElementById('gameHud');
  const gameHint = document.getElementById('gameHint');

  let W = 0, H = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);

  let current = null;
  function stopCurrentGame() {
    if (current && current.stop) current.stop();
    current = null;
  }

  function showOverlay(emoji, title, text, rewardXp, rewardTk, btnLabel) {
    ovEmoji.textContent = emoji;
    ovTitle.textContent = title;
    ovText.textContent = text;
    if (rewardXp !== null) {
      ovReward.style.display = 'flex';
      document.getElementById('ovXp').textContent = rewardXp;
      document.getElementById('ovTk').textContent = rewardTk;
    } else {
      ovReward.style.display = 'none';
    }
    ovBtn.textContent = btnLabel;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function grantReward(game, score, xp, tk, isRecordLower) {
    P.plays++;
    if (game === 'varenyk') P.tot.varenyk += score;
    if (game === 'snake') P.tot.snake += score;
    const isRecord = isRecordLower
      ? (score > 0 && (P.best[game] === 0 || score < P.best[game]))
      : (score > P.best[game]);
    if (isRecord) P.best[game] = score;
    addTokens(tk);
    addXp(xp);
    save();
    checkAch();
    return isRecord;
  }

  function startGame(name) {
    show('game');
    resize();
    stopCurrentGame();
    if (name === 'varenyk') current = gameVarenyk();
    if (name === 'snake') current = gameSnake();
    if (name === 'react') current = gameReact();
    if (name === 'miner') current = gameMiner();
  }

  /* ================= ИГРА 1: ВАРЕНИК ================= */

  function gameVarenyk() {
    let running = false, raf = 0;
    let score = 0, lives = 3, elapsed = 0, spawnT = 0, flash = 0, last = 0;
    let plateX = 0.5, targetX = 0.5;
    let items = [];
    const keys = {};

    gameHint.textContent = t('var_hint');
    updateHud();

    function updateHud() { gameHud.innerHTML = '❤️ ' + lives + ' &nbsp; 🥟 ' + score; }

    const TYPES = {
      varenyk: { emoji: '🥟', weight: 62, points: 1 },
      smetana: { emoji: '🥛', weight: 8, points: 5 },
      pepper: { emoji: '🌶️', weight: 30, points: 0 }
    };
    function pickType() {
      let total = 0; for (const x of Object.values(TYPES)) total += x.weight;
      let r = Math.random() * total;
      for (const [n, x] of Object.entries(TYPES)) if ((r -= x.weight) < 0) return n;
      return 'varenyk';
    }

    function begin() {
      score = 0; lives = 3; items = []; elapsed = 0; spawnT = 0;
      plateX = targetX = 0.5;
      updateHud(); hideOverlay();
      running = true; last = performance.now();
      raf = requestAnimationFrame(loop);
    }

    function over() {
      running = false;
      const xp = score * 2;
      const tk = Math.floor(score / 4);
      const rec = grantReward('varenyk', score, xp, tk, false);
      showOverlay(rec ? '🏆' : '😵', rec ? t('record') : t('var_over'),
        fmt(t('var_score'), { n: score }), xp, tk, t('again'));
    }

    function loop(now) {
      if (!running) return;
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now; elapsed += dt;
      if (flash > 0) flash -= dt;

      if (keys['ArrowLeft']) targetX = Math.max(targetX - 0.9 * dt, 0.06);
      if (keys['ArrowRight']) targetX = Math.min(targetX + 0.9 * dt, 0.94);
      plateX += (targetX - plateX) * Math.min(dt * 14, 1);

      const d = Math.min(elapsed / 60, 1);
      const fall = 130 + 260 * d + score * 1.2;
      const every = Math.max(0.9 - 0.55 * d, 0.35);
      spawnT -= dt;
      if (spawnT <= 0) {
        items.push({ x: 0.08 + Math.random() * 0.84, y: -0.06, type: pickType(), wob: Math.random() * 7 });
        spawnT = every;
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += (fall / H) * dt;
        if (it.y > 0.86 && it.y < 0.92 && Math.abs(it.x - plateX) < 0.09) {
          if (it.type === 'pepper') { lives--; flash = 0.4; if (lives <= 0) { items.splice(i, 1); updateHud(); over(); return; } }
          else score += TYPES[it.type].points;
          items.splice(i, 1); updateHud(); continue;
        }
        if (it.y > 1.05) {
          if (it.type === 'varenyk') { lives--; flash = 0.4; if (lives <= 0) { items.splice(i, 1); updateHud(); over(); return; } }
          items.splice(i, 1); updateHud();
        }
      }

      ctx.clearRect(0, 0, W, H);
      if (flash > 0) { ctx.fillStyle = 'rgba(220,60,30,' + flash * 0.5 + ')'; ctx.fillRect(0, 0, W, H); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = Math.round(W * 0.085) + 'px serif';
      for (const it of items) {
        const wob = Math.sin(it.wob + it.y * 9) * W * 0.012;
        ctx.fillText(TYPES[it.type].emoji, it.x * W + wob, it.y * H);
      }
      ctx.font = Math.round(W * 0.14) + 'px serif';
      ctx.fillText('🍽️', plateX * W, H * 0.9);

      raf = requestAnimationFrame(loop);
    }

    function onPointer(e) {
      const r = stage.getBoundingClientRect();
      targetX = Math.min(Math.max((e.clientX - r.left) / r.width, 0.06), 0.94);
    }
    function onKeyDown(e) { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key] = true; e.preventDefault(); } }
    function onKeyUp(e) { keys[e.key] = false; }

    stage.addEventListener('pointerdown', onPointer);
    stage.addEventListener('pointermove', onPointer);
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    ovBtn.onclick = begin;

    showOverlay('🥟', t('g_varenyk'), t('var_intro'), null, null, t('play'));

    return {
      stop() {
        running = false; cancelAnimationFrame(raf);
        stage.removeEventListener('pointerdown', onPointer);
        stage.removeEventListener('pointermove', onPointer);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('keyup', onKeyUp);
      }
    };
  }

  /* ================= ИГРА 2: ЗМЕЙКА ================= */

  function gameSnake() {
    const COLS = 15, ROWS = 20;
    let running = false, raf = 0, last = 0, acc = 0;
    let snake, dir, nextDir, food, score = 0, speed;
    let touchStart = null;

    gameHint.textContent = t('sn_hint');

    function updateHud() { gameHud.innerHTML = '🍎 ' + score; }
    updateHud();

    function placeFood() {
      while (true) {
        const f = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        if (!snake.some(sg => sg.x === f.x && sg.y === f.y)) return f;
      }
    }

    function begin() {
      snake = [{ x: 7, y: 10 }, { x: 6, y: 10 }, { x: 5, y: 10 }];
      dir = { x: 1, y: 0 }; nextDir = dir;
      score = 0; speed = 6;
      food = placeFood();
      updateHud(); hideOverlay();
      running = true; last = performance.now(); acc = 0;
      raf = requestAnimationFrame(loop);
    }

    function over() {
      running = false;
      const xp = score * 3;
      const tk = Math.floor(score / 3);
      const rec = grantReward('snake', score, xp, tk, false);
      showOverlay(rec ? '🏆' : '💀', rec ? t('record') : t('sn_over'),
        fmt(t('sn_score'), { n: score }), xp, tk, t('again'));
    }

    function step() {
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return over();
      if (snake.some(sg => sg.x === head.x && sg.y === head.y)) return over();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++; updateHud();
        speed = Math.min(6 + score * 0.35, 14);
        food = placeFood();
      } else {
        snake.pop();
      }
    }

    function loop(now) {
      if (!running) return;
      const dt = (now - last) / 1000; last = now;
      acc += dt;
      const interval = 1 / speed;
      while (acc >= interval && running) { acc -= interval; step(); }
      if (!running) return;

      const cell = Math.min(W / COLS, H / ROWS);
      const ox = (W - cell * COLS) / 2, oy = (H - cell * ROWS) / 2;
      ctx.clearRect(0, 0, W, H);
      const cs = getComputedStyle(document.documentElement);
      ctx.fillStyle = cs.getPropertyValue('--bg').trim();
      ctx.fillRect(ox, oy, cell * COLS, cell * ROWS);

      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = Math.round(cell * 0.85) + 'px serif';
      ctx.fillText('🍎', ox + (food.x + 0.5) * cell, oy + (food.y + 0.55) * cell);

      const green = cs.getPropertyValue('--green').trim();
      snake.forEach((sg, i) => {
        ctx.fillStyle = green;
        const pad = i === 0 ? 1 : 2;
        ctx.beginPath();
        ctx.roundRect(ox + sg.x * cell + pad, oy + sg.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.25);
        ctx.fill();
      });
      const h = snake[0];
      ctx.fillStyle = '#fff';
      const ex = ox + (h.x + 0.5) * cell, ey = oy + (h.y + 0.4) * cell;
      ctx.beginPath(); ctx.arc(ex - cell * 0.16, ey, cell * 0.09, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(ex + cell * 0.16, ey, cell * 0.09, 0, 7); ctx.fill();

      raf = requestAnimationFrame(loop);
    }

    function turn(nx, ny) {
      if (nx === -dir.x && ny === -dir.y) return;
      nextDir = { x: nx, y: ny };
    }
    function onKey(e) {
      const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
      if (m[e.key]) { e.preventDefault(); turn(m[e.key][0], m[e.key][1]); }
    }
    function onTouchStart(e) { const tt = e.changedTouches[0]; touchStart = { x: tt.clientX, y: tt.clientY }; }
    function onTouchEnd(e) {
      if (!touchStart) return;
      const tt = e.changedTouches[0];
      const dx = tt.clientX - touchStart.x, dy = tt.clientY - touchStart.y;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
      else turn(0, dy > 0 ? 1 : -1);
      touchStart = null;
    }

    window.addEventListener('keydown', onKey);
    stage.addEventListener('touchstart', onTouchStart, { passive: true });
    stage.addEventListener('touchend', onTouchEnd, { passive: true });
    ovBtn.onclick = begin;

    showOverlay('🐍', t('g_snake'), t('sn_intro'), null, null, t('play'));

    return {
      stop() {
        running = false; cancelAnimationFrame(raf);
        window.removeEventListener('keydown', onKey);
        stage.removeEventListener('touchstart', onTouchStart);
        stage.removeEventListener('touchend', onTouchEnd);
      }
    };
  }

  /* ================= ИГРА 3: РЕАКЦИЯ ================= */

  function gameReact() {
    const ROUNDS = 5;
    let phase = 'idle';
    let round = 0, times = [], tm = 0, goAt = 0;

    gameHint.textContent = t('re_hint');
    function updateHud() { gameHud.innerHTML = fmt(t('re_round'), { a: Math.min(round + 1, ROUNDS), b: ROUNDS }); }
    updateHud();

    function draw(color, big, small) {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = color;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 ' + Math.round(W * 0.09) + 'px Nunito, sans-serif';
      ctx.fillText(big, W / 2, H / 2 - 14);
      if (small) {
        ctx.font = '700 ' + Math.round(W * 0.045) + 'px Nunito, sans-serif';
        ctx.fillText(small, W / 2, H / 2 + Math.round(W * 0.09));
      }
    }

    function begin() {
      round = 0; times = [];
      hideOverlay(); updateHud();
      nextRound();
    }

    function nextRound() {
      phase = 'wait';
      draw('#D93A45', t('re_wait'), t('re_wait2'));
      clearTimeout(tm);
      tm = setTimeout(() => {
        phase = 'go';
        goAt = performance.now();
        draw('#22B573', t('re_go'), '');
      }, 1200 + Math.random() * 2300);
    }

    function tap() {
      if (phase === 'wait') {
        clearTimeout(tm);
        draw('#4A5568', t('re_early'), t('re_early2'));
        tm = setTimeout(nextRound, 1000);
        return;
      }
      if (phase === 'go') {
        const ms = Math.round(performance.now() - goAt);
        times.push(ms);
        round++;
        updateHud();
        if (round >= ROUNDS) return finish();
        draw('#141A24', ms + ' ' + t('ms'), t('re_next'));
        clearTimeout(tm);
        tm = setTimeout(nextRound, 900);
      }
    }

    function finish() {
      phase = 'done';
      const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
      const xp = Math.max(6, 65 - Math.floor(avg / 8));
      const tk = Math.max(1, 22 - Math.floor(avg / 20));
      const rec = grantReward('react', avg, xp, tk, true);
      let cmt;
      if (avg < 220) cmt = t('re_c1');
      else if (avg < 300) cmt = t('re_c2');
      else if (avg < 400) cmt = t('re_c3');
      else cmt = t('re_c4');
      showOverlay(rec ? '🏆' : '⚡', rec ? t('record') : t('re_done'),
        fmt(t('re_res'), { n: avg, c: cmt }), xp, tk, t('again'));
    }

    function onTap(e) { e.preventDefault(); tap(); }
    stage.addEventListener('pointerdown', onTap);
    ovBtn.onclick = begin;

    showOverlay('⚡', t('g_react'), t('re_intro'), null, null, t('play'));

    return {
      stop() {
        clearTimeout(tm);
        stage.removeEventListener('pointerdown', onTap);
      }
    };
  }

  /* ================= ИГРА 4: САПЁР ================= */

  function gameMiner() {
    const COLS = 9, ROWS = 12, MINES = 14;
    const NUM_COLORS = ['', '#1976D2', '#388E3C', '#D32F2F', '#7B1FA2', '#E65100', '#19C3E6', '#EAF1F8', '#9E9E9E'];
    let grid, alive = false, started = false, revealed = 0, flagsLeft = MINES;
    let time = 0, timerInt = 0, flagMode = false;
    let pressCell = null, longTm = 0, longFired = false;

    gameHint.innerHTML = t('mi_hint') + '<button class="btn sm ghost" id="flagBtn" type="button">' + t('mi_flag_off') + '</button>';
    const flagBtn = document.getElementById('flagBtn');
    flagBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagBtn.textContent = flagMode ? t('mi_flag_on') : t('mi_flag_off');
    });

    function updateHud() { gameHud.innerHTML = '💣 ' + flagsLeft + ' &nbsp; ⏱ ' + time + ' ' + t('s'); }

    function makeGrid() {
      grid = [];
      for (let y = 0; y < ROWS; y++) {
        const row = [];
        for (let x = 0; x < COLS; x++) row.push({ mine: false, num: 0, open: false, flag: false });
        grid.push(row);
      }
    }

    function neighbors(x, y, fn) {
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        if (!dx && !dy) continue;
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) fn(nx, ny);
      }
    }

    function placeMines(sx, sy) {
      const banned = new Set([sy * COLS + sx]);
      neighbors(sx, sy, (nx, ny) => banned.add(ny * COLS + nx));
      let placed = 0;
      while (placed < MINES) {
        const i = Math.floor(Math.random() * COLS * ROWS);
        const x = i % COLS, y = Math.floor(i / COLS);
        if (banned.has(i) || grid[y][x].mine) continue;
        grid[y][x].mine = true; placed++;
      }
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        let n = 0;
        neighbors(x, y, (nx, ny) => { if (grid[ny][nx].mine) n++; });
        grid[y][x].num = n;
      }
    }

    function geom() {
      const cell = Math.min(W / COLS, H / ROWS);
      return { cell, ox: (W - cell * COLS) / 2, oy: (H - cell * ROWS) / 2 };
    }

    function draw(showMines) {
      const { cell, ox, oy } = geom();
      const cs = getComputedStyle(document.documentElement);
      const line = cs.getPropertyValue('--line').trim();
      const bg = cs.getPropertyValue('--bg').trim();
      const panel = cs.getPropertyValue('--panel').trim();
      ctx.clearRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const c = grid[y][x];
        const px = ox + x * cell, py = oy + y * cell;
        ctx.fillStyle = c.open ? panel : bg;
        ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
        if (!c.open) {
          ctx.strokeStyle = line; ctx.lineWidth = 2;
          ctx.strokeRect(px + 2, py + 2, cell - 4, cell - 4);
        }
        if (c.open && c.num > 0 && !c.mine) {
          ctx.fillStyle = NUM_COLORS[c.num];
          ctx.font = '800 ' + Math.round(cell * 0.55) + 'px Nunito, sans-serif';
          ctx.fillText(c.num, px + cell / 2, py + cell / 2 + 1);
        }
        ctx.font = Math.round(cell * 0.6) + 'px serif';
        if (c.flag && !c.open) ctx.fillText('🚩', px + cell / 2, py + cell / 2);
        if (showMines && c.mine) ctx.fillText('💣', px + cell / 2, py + cell / 2);
      }
    }

    function begin() {
      makeGrid();
      alive = true; started = false; revealed = 0; flagsLeft = MINES; time = 0;
      clearInterval(timerInt);
      updateHud(); hideOverlay(); draw(false);
    }

    function startTimer() {
      timerInt = setInterval(() => { time++; updateHud(); }, 1000);
    }

    function lose() {
      alive = false;
      clearInterval(timerInt);
      draw(true);
      const xp = Math.max(3, Math.round(revealed * 0.6));
      grantReward('miner', 0, xp, 1, true);
      setTimeout(() => {
        showOverlay('💥', t('mi_boom'), fmt(t('mi_boom_t'), { n: revealed }), xp, 1, t('again'));
      }, 900);
    }

    function win() {
      alive = false;
      clearInterval(timerInt);
      draw(true);
      P.tot.minerWins++;
      const xp = Math.max(35, 130 - time);
      const tk = Math.max(8, 35 - Math.floor(time / 8));
      const rec = grantReward('miner', time, xp, tk, true);
      showOverlay(rec ? '🏆' : '🎖️', rec ? t('record') : t('mi_win'),
        fmt(t('mi_win_t'), { n: time }), xp, tk, t('again'));
    }

    function reveal(x, y) {
      const c = grid[y][x];
      if (c.open || c.flag) return;
      if (!started) { placeMines(x, y); started = true; startTimer(); }
      if (c.mine) { c.open = true; return lose(); }
      const stack = [[x, y]];
      while (stack.length) {
        const [cx, cy] = stack.pop();
        const cc = grid[cy][cx];
        if (cc.open || cc.flag || cc.mine) continue;
        cc.open = true; revealed++;
        if (cc.num === 0) neighbors(cx, cy, (nx, ny) => {
          if (!grid[ny][nx].open) stack.push([nx, ny]);
        });
      }
      draw(false);
      if (revealed === COLS * ROWS - MINES) win();
    }

    function toggleFlag(x, y) {
      const c = grid[y][x];
      if (c.open) return;
      if (!c.flag && flagsLeft <= 0) { toast(t('mi_flags_out')); return; }
      c.flag = !c.flag;
      flagsLeft += c.flag ? -1 : 1;
      updateHud(); draw(false);
    }

    function cellAt(e) {
      const r = stage.getBoundingClientRect();
      const { cell, ox, oy } = geom();
      const x = Math.floor((e.clientX - r.left - ox) / cell);
      const y = Math.floor((e.clientY - r.top - oy) / cell);
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return null;
      return { x, y };
    }

    function onDown(e) {
      if (!alive) return;
      pressCell = cellAt(e);
      longFired = false;
      if (!pressCell) return;
      clearTimeout(longTm);
      longTm = setTimeout(() => {
        longFired = true;
        toggleFlag(pressCell.x, pressCell.y);
      }, 420);
    }
    function onUp(e) {
      clearTimeout(longTm);
      if (!alive || longFired || !pressCell) { pressCell = null; return; }
      const c = cellAt(e);
      if (c && c.x === pressCell.x && c.y === pressCell.y) {
        if (flagMode) toggleFlag(c.x, c.y);
        else reveal(c.x, c.y);
      }
      pressCell = null;
    }
    function onCancel() { clearTimeout(longTm); pressCell = null; }
    function onCtx(e) { e.preventDefault(); }

    stage.addEventListener('pointerdown', onDown);
    stage.addEventListener('pointerup', onUp);
    stage.addEventListener('pointerleave', onCancel);
    stage.addEventListener('contextmenu', onCtx);
    ovBtn.onclick = begin;

    showOverlay('💣', t('g_miner'), t('mi_intro'), null, null, t('play'));

    return {
      stop() {
        clearInterval(timerInt); clearTimeout(longTm);
        stage.removeEventListener('pointerdown', onDown);
        stage.removeEventListener('pointerup', onUp);
        stage.removeEventListener('pointerleave', onCancel);
        stage.removeEventListener('contextmenu', onCtx);
      }
    };
  }

  /* ================= СТАРТ ================= */
  document.documentElement.lang = LANG === 'uk' ? 'uk' : LANG;
  applyLang();
  renderHome();
})();
</script>
</body>
</html>
